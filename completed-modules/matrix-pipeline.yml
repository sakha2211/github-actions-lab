name: Matrix and Flow Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - name: Step 1 - Checkout code
        uses: actions/checkout@v4

      - name: Step 2 - Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

  notify-result:
    runs-on: ubuntu-latest
    needs: test-matrix
    steps:
      - name: notify success
        if: success()
        run: |
          echo "All matrix tests succeeded!"
      
      - name: cleanup
        if: always()
        run: |
          echo "Pipeline cleanup complete!"