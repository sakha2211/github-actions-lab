name: Flow Control and Conditions Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Start tests
        run: echo "Starting application tests..."

      - name: Step 2 - Run Unit Tests
        run: |
          echo "Running tests... Everything passed!"
          exit 0

      - name: Step 3 - Celebrate Success
        if: success()
        run: echo "GREEN LIGHT: All tests passed!"

      - name: Step 4 - Send Emergency Alert on Failure
        if: failure()
        run: echo "RED ALERT: A step crashed! Paging the DevOps team!"

      - name: Step 5 - Cleanup Temporary Files
        if: always()
        run: echo "JANITOR: Cleaning up temporary files regardless of pass/fail."

  deploy-job:
    runs-on: ubuntu-latest
    needs: test-job
    if: success() && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy after tests pass
        run: echo "Job 1 succeeded on main branch! Deploying now..."
