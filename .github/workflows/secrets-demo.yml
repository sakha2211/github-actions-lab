# File path: .github/workflows/secrets-demo.yml

name: Secrets and Variables Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  security-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Connect to Database
        env:
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "Connecting to database server: $DB_HOST"
          echo "Using secret password: $DB_PASSWORD"
