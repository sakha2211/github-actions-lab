name: Secrets and Variables Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  security-check:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: connect to database
        env:
          DB_HOST: ${{ var.DB_HOST }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "Connecting to database server: $DB_HOST"
          echo "Using secret password: $DB_PASSWORD"
        