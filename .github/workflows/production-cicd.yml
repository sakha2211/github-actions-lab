# File path: .github/workflows/production-cicd.yml

name: Production End-to-End CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Grant permission to read code and push Docker packages
permissions:
  contents: read
  packages: write

jobs:
  # STAGE 1: Spellcheck (Lint) and Test the Code
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Step 1 - Checkout repository code
        uses: actions/checkout@v4

      - name: Step 2 - Cache pip dependencies for speed
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Step 3 - Install linter and test tools
        run: pip install -r requirements.txt

      - name: Step 4 - Lint code (Spellcheck with flake8)
        run: flake8 app.py

      - name: Step 5 - Run automated unit tests (with pytest)
        run: pytest test_app.py

  # STAGE 2: Build, Tag, and Push Docker Image to Container Registry
  build-and-push-docker:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Step 1 - Checkout repository code
        uses: actions/checkout@v4

      - name: Step 2 - Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Step 3 - Build and Push Docker image with Git SHA
        run: |
          IMAGE_TAG="ghcr.io/${{ github.repository }}:${{ github.sha }}"
          echo "Building image: $IMAGE_TAG"
          docker build -t $IMAGE_TAG .
          echo "Pushing image to Container Registry..."
          docker push $IMAGE_TAG
